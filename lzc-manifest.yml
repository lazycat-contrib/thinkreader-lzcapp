name: ThinkRead
package: community.lazycat.app.thinkread
version: 0.1.0
min_os_version: 1.3.8
description: "Simple ebook reader made in React with sync across devices and TTS"
license: MIT
homepage: https://github.com/nikunjsingh93/thinkread-ebook-reader
author: Nikunj Singh

application:
  subdomain: thinkread
  upstreams:
    - location: /
      backend: http://thinkread:8080/

services:
  thinkread:
    # nikunjsingh/thinkread-ebook-reader:latest
    image: registry.lazycat.cloud/czyt/nikunjsingh/thinkread-ebook-reader:b851c08094ad25ea
    environment:
      - DATA_DIR=/data
    binds:
      - /lzcapp/var/data:/data

locales:
  en:
    name: "ThinkRead"
    description: "Simple ebook reader made in React with sync across devices and TTS"
  zh:
    name: "ThinkRead"
    description: "基于 React 开发的简单电子书阅读器，支持跨设备同步和文本转语音(TTS)功能"
