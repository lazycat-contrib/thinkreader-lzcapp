application:
  subdomain: thinkread
  upstreams:
    - location: /
      backend: http://thinkread:8080/
services:
  thinkread:
    # upstream: nikunjsingh/thinkread-ebook-reader:v1.3.5
    image: registry.lazycat.cloud/czyt/nikunjsingh/thinkread-ebook-reader:199b132b02b52c06
    environment:
      - DATA_DIR=/data
    binds:
      - /lzcapp/var/data:/data
