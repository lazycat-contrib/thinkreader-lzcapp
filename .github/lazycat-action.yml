version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/thinkread.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: thinkread
build:
  run_buildscript: false
images:
  - id: thinkread
    target: service
    service: thinkread
    source: nikunjsingh/thinkread-ebook-reader
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: ThinkRead
    summary: "基于 React 开发的简单电子书阅读器，支持跨设备同步和文本转语音(TTS)功能"
